info:
  app:
    name: location-service
    description: Cycle de vie des locations DriveEasy

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

driveeasy:
  location:
    remise-fidele: 0.05
    remise-vip: 0.10
    coefficient-penalite: 1.5
    locations-pour-fidele: 5
    locations-pour-vip: 15

info:
  app:
    name: client-service
    description: Gestion des clients DriveEasy

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

driveeasy:
  client:
    age-minimum: 21
    locations-pour-fidele: 5
    locations-pour-vip: 15
